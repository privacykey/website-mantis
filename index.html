<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Same defence-in-depth CSP / referrer pair as the per-locale pages.
       This file is just a language redirect splash with one inline script
       and one inline style, so the policy could be tightened further, but
       keeping it identical means future locales don't surprise. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>mantis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=./en/index.html" />
  <link rel="canonical" href="./en/" />
  <link rel="alternate" hreflang="en" href="./en/" />
  <link rel="alternate" hreflang="x-default" href="./en/" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <style>
    /* Splash colours + brand mark match the mono default theme so the
       redirect flash doesn't show a different palette or wordmark from
       the page it's about to land on. */
    html, body { margin: 0; padding: 0; background: #0B0B12; color: #E8E8F2;
                 font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    a { color: #FFFFFF; text-decoration: underline; text-underline-offset: 4px; padding: 8px;
        display: inline-block; min-height: 44px; box-sizing: border-box; line-height: 28px; }
    .mark { color: #FFFFFF; font-weight: 700; margin-right: 6px; }
    .blink { animation: blink 1s steps(2,end) infinite; }
    @keyframes blink { 50%, 100% { opacity: 0; } }
  </style>
  <script>
    (function () {
      try {
        // mantis ships English-only for now. Plumbing kept for future
        // locales — mirrors privacykey's pattern so future translations
        // drop in without touching this script.
        window.location.replace('./en/index.html');
      } catch (e) {
        window.location.replace('./en/index.html');
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <p>
      <span class="mark" aria-hidden="true">◉</span> mantis booting<span class="blink">...</span><br />
      <a href="./en/index.html">→ continue to mantis</a>
    </p>
  </div>
</body>
</html>

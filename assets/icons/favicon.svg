<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- mantis mark: concentric dot (◉). Outer ring + filled inner disc.
       Matches the wordmark glyph used in the nav and footer. Mono palette
       so the favicon agrees with the default theme on first paint. -->
  <rect width="32" height="32" rx="4" fill="#0B0B0B"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#F5F5F4" stroke-width="2.4"/>
  <circle cx="16" cy="16" r="5"  fill="#F5F5F4"/>
</svg>

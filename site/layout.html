<!doctype html>
<html lang="en" dir="ltr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <script>{{themeBootstrap}}</script>
  <script src="/assets/reading-preferences.js"></script>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="application-name" content="mantis">
  <meta name="author" content="privacykey">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#0B0B12">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" hreflang="en" href="{{canonical}}">
  <link rel="alternate" hreflang="x-default" href="{{canonical}}">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="mantis">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{origin}}/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="mantis: plant a tripwire URL, get an alert when it is fetched. Self-hosted or edge.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{origin}}/assets/social-preview.png">
  <meta name="twitter:image:alt" content="mantis: tripwire URLs and alerts. Self-hosted or edge.">
  {{structuredData}}
  <link rel="stylesheet" href="/assets/themes.css">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<!-- Generated by scripts/build.mjs. Edit site/pages and site/partials. -->
<a class="skip-link" href="#main">Skip to content</a>
{{navigation}}
<main id="main" tabindex="-1">{{breadcrumbs}}{{content}}</main>
{{footer}}
<p id="interaction-status" class="sr-only" role="status" aria-atomic="true"></p>
<script src="/assets/theme.js"></script>
<script src="/assets/footer.js"></script>
{{pageScripts}}
</body>
</html>

name: Release version check
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the latest tagged releases locally
        run: node scripts/sync-releases.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/check.mjs
      - name: Report release drift for a reviewed update
        run: |
          if ! git diff --exit-code -- version.json en 404.html; then
            echo 'Tagged releases changed. Run node scripts/sync-releases.mjs and submit the generated changes for review.'
            exit 1
          fi

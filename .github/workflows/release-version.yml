name: Release sync
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the latest tagged releases locally
        run: node scripts/sync-releases.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Pull requests opened with the workflow token may not start "Website checks",
      # so the generated pages are checked here before anything is proposed.
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.mjs
      - name: Open or update a pull request for a reviewed update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-releases
          delete-branch: true
          add-paths: |
            version.json
            en
            404.html
          commit-message: 'chore: sync release data from tagged releases'
          title: Sync release data from tagged releases
          body: |
            Tagged releases in `privacykey/mantis` changed. This pull request was regenerated by `node scripts/sync-releases.mjs` and updates `version.json` and the release links and badges in the generated pages.

            `node scripts/check.mjs` and the tests passed in [the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) that opened it.

            Reviewer checklist:

            - [ ] Each component points at the intended tag: `cli-v…` for the CLI, a bare `v…` for the full server, `edge-v…` for the edge worker.
            - [ ] No draft release is listed.

            Merging deploys the site through Cloudflare Workers Builds.
